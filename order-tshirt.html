    <script>
        const form = document.getElementById('orderForm');
        const alertBox = document.getElementById('formAlert');
        const submitBtn = document.getElementById('submitBtn');

        const GOOGLE_FUNCTION_URL = "https://us-east4-mth-web-site-processing.cloudfunctions.net/TShirtEmailSenderFunction";
        const RECAPTCHA_SITE_KEY = "6Ldw9VUsAAAAAGt-sPd_kOGwhTmH65lT_wfiJ0tE";

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Show processing state 
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                // Wait for enterprise reCAPTCHA to be ready and generate the token
                const token = await new Promise((resolve, reject) => {
                    grecaptcha.enterprise.ready(() => {
                        grecaptcha.enterprise.execute(RECAPTCHA_SITE_KEY, { action: 'apparel_order' })
                            .then(resolve)
                            .catch(reject);
                    });
                });

                const formData = new FormData(form);
                formData.append('g-recaptcha-response', token);

                // Send data to backend
                const response = await fetch(GOOGLE_FUNCTION_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Order received! We will email you shortly.';
                    alertBox.classList.remove('d-none');
                    form.reset();
                } else {
                    throw new Error('Server response was not ok.');
                }
            } catch (error) {
                console.error('Error:', error);
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Something went wrong. Please try again later.';
                alertBox.classList.remove('d-none');
            } finally {
                // Reset button text
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'SUBMIT ORDER';
            }
        });
    </script>
