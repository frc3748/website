    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const PROXY_URL     = 'https://us-east4-mth-web-site-processing.cloudfunctions.net/mth-first-proxy';
        const DISTRICT_CODE = 'FCH';
        const TEAM_NUM      = 3748;
        const REFRESH_INTERVAL_MS = 5 * 60 * 1000;
        let countdownSeconds = REFRESH_INTERVAL_MS / 1000;

        function rankBadge(rank) {
            if (rank === 1) return '<span class="badge" style="background:var(--ragnarok-gold);color:#000;">🏆 #1</span>';
            if (rank <= 3) return `<span class="badge bg-secondary">#${rank}</span>`;
            return `<span class="badge bg-dark border border-secondary">#${rank}</span>`;
        }

        function updateCountdown() {
            countdownSeconds--;
            if (countdownSeconds < 0) countdownSeconds = REFRESH_INTERVAL_MS / 1000;
            const m = Math.floor(countdownSeconds / 60);
            const s = countdownSeconds % 60;
            const el = document.getElementById('tba-countdown-seconds');
            if (el) el.textContent = `${m}:${String(s).padStart(2, '0')}`;
        }

        async function loadRankings() {
            countdownSeconds = REFRESH_INTERVAL_MS / 1000;
            try {
                const res  = await fetch(`${PROXY_URL}?districtCode=${DISTRICT_CODE}`);
                if (!res.ok) throw new Error(`Proxy ${res.status}`);
                const data = await res.json();

                const our   = data.ourRanking;
                const total = data.totalTeams;

                if (our) {
                    document.getElementById('our-rank').innerHTML =
                        `${rankBadge(our.rank)} <span class="text-white-50 ms-1 fs-90">of ${total}</span>`;
                    document.getElementById('our-points').textContent = our.totalPoints;

                    const dcmp = our.qualifiedDistrictCmp;
                    const cmp  = our.qualifiedFirstCmp;
                    document.getElementById('our-dcmp').textContent = dcmp ? '✅ Yes' : '⬜ No';
                    document.getElementById('our-dcmp').style.color = dcmp ? '#4caf50' : '#aaa';
                    document.getElementById('our-cmp').textContent  = cmp  ? '✅ Yes' : '⬜ No';
                    document.getElementById('our-cmp').style.color  = cmp  ? '#4caf50' : '#aaa';
                }

                const rows = (data.rankings || []).map(r => {
                    const isOurs    = r.teamNumber === TEAM_NUM;
                    const rowStyle  = isOurs ? 'background:rgba(234,173,31,0.12); font-weight:600;' : '';
                    const teamLabel = isOurs
                        ? `<span class="text-gold">&#9733; ${r.teamNumber}</span>`
                        : r.teamNumber;
                    const evt1 = r.event1Code ? `<span title="${r.event1Code}">${r.event1Points}</span>` : '—';
                    const evt2 = r.event2Code ? `<span title="${r.event2Code}">${r.event2Points}</span>` : '—';
                    const dcmp = r.qualifiedDistrictCmp ? '✅' : '⬜';
                    const cmp  = r.qualifiedFirstCmp    ? '✅' : '⬜';
                    return `<tr style="${rowStyle}">
                        <td>${rankBadge(r.rank)}</td>
                        <td>${teamLabel}</td>
                        <td class="text-white-50 fs-80">${r.teamName}</td>
                        <td class="text-white fw-semibold">${r.totalPoints}</td>
                        <td class="text-white-50 text-center">${evt1}</td>
                        <td class="text-white-50 text-center">${evt2}</td>
                        <td class="text-center">${dcmp}</td>
                        <td class="text-center">${cmp}</td>
                    </tr>`;
                }).join('');

                document.getElementById('district-rankings-body').innerHTML =
                    rows || '<tr><td colspan="8" class="text-white-50 text-center">No rankings available yet.</td></tr>';

                document.getElementById('tba-section').style.display = '';
                document.getElementById('loading-spinner').style.display = 'none';
            } catch (e) {
                document.getElementById('loading-spinner').style.display = 'none';
                document.getElementById('tba-section').innerHTML =
                    `<div class="alert alert-danger m-3">Could not load district rankings: ${e.message}</div>`;
                document.getElementById('tba-section').style.display = '';
            }
        }

        loadRankings();
        setInterval(loadRankings, REFRESH_INTERVAL_MS);
        setInterval(updateCountdown, 1000);
    </script>
