<body>
    <script>renderNav()</script>

    <header class="main-hero">
        <div class="container">
            <h1 class="display-3 mb-2">CONTACT US</h1>
            <p class="text-white-50 mb-2 tagline">Thank You For Your Interest
            </p>
        </div>
    </header>

    <div class="container my-5">
        <div class="row g-4 align-items-stretch">
            <div class="col-md-5">
                <div class="p-4 h-100 d-flex flex-column callout-dark callout-gold">
                    <h3 class="viking-font mb-3">Get in Touch</h3>

                    <div class="mb-3">
                        <h5 class="mb-1 text-gold">Location</h5>
                        <p class="text-white text-decoration-none mb-0">
                            Mt. Hebron High School<br>
                            9440 Old Frederick Rd<br>
                            Ellicott City, MD 21042
                        </p>
                    </div>

                    <div class="mt-auto">
                        <h5 class="mb-2 text-gold">Socials</h5>
                        <div class="social-icons" style="margin-left: -15px;">
                            <a href="https://www.facebook.com/Team3748Ragnarok" target="_blank" rel="noopener"><i
                                    class="fab fa-facebook"></i></a>
                            <a href="https://www.instagram.com/frc3748/" target="_blank" rel="noopener"><i
                                    class="fab fa-instagram"></i></a>
                            <a href="https://www.youtube.com/c/frcroboticsteam3748" target="_blank" rel="noopener"><i
                                    class="fab fa-youtube"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="p-4 h-100 callout-dark callout-gold">
                    <h3 class="viking-font mb-3">Send a Message</h3>
                    <form id="emailForm" method="POST">
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <input type="text" name="name" class="form-control form-control-sm custom-input"
                                    id="name" placeholder="Your Name" required>
                            </div>
                            <div class="col-md-6">
                                <input type="email" name="email" class="form-control form-control-sm custom-input"
                                    id="email" placeholder="Email Address" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <select name="subject" class="form-select form-select-sm custom-input" id="subject">
                                <option value="" disabled selected>Select Subject</option>
                                <option value="Sponsorship">Sponsorship Opportunity</option>
                                <option value="General Inquiry">General Inquiry</option>
                                <option value="Mentorship">Mentorship</option>
                                <option value="Outreach">Community Outreach</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <textarea name="message" class="form-control form-control-sm custom-input" id="message"
                                rows="3" placeholder="Your Message" required></textarea>
                        </div>

                        <button id="submitBtn" type="submit" class="btn btn-norse w-100 py-2">SEND MESSAGE</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>renderFooter()</script>

    <div id="successPopup" class="popup-overlay">
        <div class="popup-content">
            <h3>Success!</h3>
            <p>Your email has been sent successfully.</p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const popup = document.getElementById('successPopup');
        const submitBtn = document.getElementById('submitBtn');

        const GOOGLE_FUNCTION_URL = "https://us-east4-mth-email-processor.cloudfunctions.net/EmailSenderFunction";
        const RECAPTCHA_SITE_KEY = "6Ldw9VUsAAAAAGt-sPd_kOGwhTmH65lT_wfiJ0tE";

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            try {
                // Disable button immediately
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> SENDING...';

                // 2. Wait for reCAPTCHA token
                const token = await new Promise((resolve, reject) => {
                    grecaptcha.enterprise.ready(() => {
                        grecaptcha.enterprise.execute(RECAPTCHA_SITE_KEY, { action: 'INQUIRY' })
                            .then(resolve)
                            .catch(reject);
                    });
                });

                // 3. Prepare data
                const formData = new FormData(form);
                formData.append('g-recaptcha-response', token);

                // 4. Send the request
                const response = await fetch(GOOGLE_FUNCTION_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    popup.style.display = 'flex';
                    form.reset();
                } else {
                    const errorText = await response.text();
                    alert("Error: " + errorText);
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Failed to connect to the server.");
            } finally {
                // 5. Always re-enable button after completion or failure
                submitBtn.disabled = false;
                submitBtn.innerHTML = "SEND MESSAGE";
            }
        });

        function closePopup() {
            popup.style.display = 'none';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
